# Install once per clone: `uvx pre-commit install`
# Run on everything:     `uvx pre-commit run --all-files`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: private-patterns
        name: private-pattern guard
        description: >-
          Fails on maintainer-listed private patterns; no-op without a list
          (~/.wx-gmail-mcp/private-patterns.txt).
        entry: python3 scripts/check_private_patterns.py
        language: system
        pass_filenames: true
