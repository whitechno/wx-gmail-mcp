name: Secrets

# Two guards in one job named `secrets` (a required check on main):
#
# 1. gitleaks scans the full history for credentials.
# 2. The private-pattern guard (scripts/check_private_patterns.py) fails
#    when a maintainer-listed pattern (real addresses, home paths,
#    project numbers, client-id prefixes) appears in any tracked file or,
#    on a PR, in a commit message. The list is the repo secret
#    PRIVATE_PATTERNS; it is masked in logs and the script prints only
#    file, line and pattern index. Fork PRs have no secret, so the guard
#    is a no-op there and prints a notice.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks comments on a PR when it finds a leak
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Private-pattern guard
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            python3 scripts/check_private_patterns.py --all \
              --commits "$BASE_SHA..$HEAD_SHA"
          else
            python3 scripts/check_private_patterns.py --all
          fi
